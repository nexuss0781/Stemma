<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="Teacher Attendance — take and review classroom attendance." />
    <title>Teacher Attendance</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./app.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="back-link" href="/#apps" aria-label="Back to apps">
          <svg class="back-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5M7.5 10H17" /></svg>
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">Roll</span>
        </a>
        <button class="import-trigger" id="open-import" type="button" aria-label="Import students">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 11.5v3A1.5 1.5 0 0 0 5.5 16h9a1.5 1.5 0 0 0 1.5-1.5v-3" /></svg>
          <span>Import students</span>
        </button>
      </header>

      <main class="main-content" id="main-content">
        <div class="page-heading">
          <div>
            <p class="eyebrow">ROLL / ATTENDANCE</p>
            <h1>Teacher Attendance</h1>
          </div>
        </div>

        <section class="attendance-panel" aria-label="Class attendance">
          <div class="roster-toolbar">
            <label class="date-control" for="attendance-date">
              <span class="visually-hidden">Attendance date</span>
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.25" y="4.5" width="13.5" height="12" rx="2"/><path d="M6.5 2.75v3.5M13.5 2.75v3.5M3.5 8h13"/></svg>
              <input id="attendance-date" type="date" />
            </label>
            <div class="roster-summary" id="roster-summary" aria-live="polite">
              <span class="progress-ring" id="progress-ring" aria-hidden="true"><span></span></span>
              <span><strong id="present-count">0</strong><span class="summary-divider"> / </span><span id="student-count">0</span><span class="summary-label"> present</span></span>
            </div>
          </div>

          <div class="status-line" id="status-line" role="status" aria-live="polite" hidden>
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-message"></span>
            <button class="text-button" id="retry-button" type="button" hidden>Retry</button>
            <a class="text-button sign-in-link" id="sign-in-link" href="/#apps" hidden>Sign in</a>
          </div>

          <div class="roster" id="roster" aria-label="Students"></div>
          <section class="empty-state" id="empty-state" aria-labelledby="empty-title" hidden>
            <img src="./splash.svg" alt="" width="192" height="152" />
            <h2 id="empty-title">Your class, ready to roll.</h2>
            <button class="primary-button" id="empty-import" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 11.5v3A1.5 1.5 0 0 0 5.5 16h9a1.5 1.5 0 0 0 1.5-1.5v-3" /></svg>
              Import students
            </button>
          </section>
        </section>
      </main>
    </div>

    <dialog class="import-dialog" id="import-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-help">
      <form class="dialog-content" id="import-form" novalidate>
        <div class="dialog-heading">
          <div class="dialog-mark" aria-hidden="true"><span class="brand-mark"><span></span><span></span><span></span></span></div>
          <button class="icon-button close-dialog" id="close-import" type="button" aria-label="Close import dialog">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
          </button>
        </div>
        <h2 id="dialog-title">Import students</h2>
        <label class="textarea-label" for="student-list">Student list</label>
        <textarea id="student-list" name="text" rows="7" required aria-describedby="dialog-help import-error" placeholder="• Avery Chen&#10;• Jordan Lee&#10;• Sam Rivera"></textarea>
        <p class="dialog-help" id="dialog-help">One student per line</p>
        <p class="form-error" id="import-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="secondary-button" id="cancel-import" type="button">Cancel</button>
          <button class="primary-button" id="submit-import" type="submit">Import list</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
