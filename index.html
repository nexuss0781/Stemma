<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5B0E14" />
  <title>Stemma</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 10h17M7 15h3"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.3-6 4.4 12 2.3-6H21"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="m12 12 6-6"/><path d="M17 6h1v1"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.3"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button menu-trigger" id="menu-trigger" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navigation-drawer">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <span class="brand-name crumb-parent">Stemma</span>
          <svg class="icon tiny" aria-hidden="true"><use href="#i-chevron"/></svg>
          <span class="crumb-skeleton crumb-current" id="breadcrumb-current" aria-hidden="true"></span>
        </nav>
      </div>
    </header>

    <main id="app-main" class="app-main overview-view" tabindex="-1" aria-label="Dashboard">
      <section class="hero-card" aria-label="Profile and balance placeholders">
        <span class="hero-orb" aria-hidden="true"></span>
        <div class="hero-skeleton-name skeleton-shimmer" aria-hidden="true"></div>
        <div class="avatar-glass" aria-hidden="true"><span class="portrait-skeleton skeleton-shimmer"></span></div>
        <div class="balance-skeleton" aria-hidden="true">
          <span class="balance-skeleton-digit skeleton-shimmer"></span>
          <span class="balance-skeleton-digit skeleton-shimmer"></span>
          <span class="balance-skeleton-digit skeleton-shimmer"></span>
          <span class="balance-skeleton-digit skeleton-shimmer"></span>
          <span class="balance-skeleton-dot"></span>
          <span class="balance-skeleton-digit skeleton-shimmer"></span>
          <span class="balance-skeleton-digit skeleton-shimmer"></span>
        </div>
      </section>
      <nav class="page-tabs" id="page-tabs" role="tablist" aria-label="Page tabs"></nav>
      <div class="section-intro" aria-hidden="true">
        <div class="section-intro-lines"><span class="intro-line intro-primary skeleton-shimmer"></span><span class="intro-line intro-secondary skeleton-shimmer"></span></div>
        <div class="section-intro-action"><span class="intro-action-line skeleton-shimmer"></span><svg class="icon"><use href="#i-arrow-up-right"/></svg></div>
      </div>
      <section class="dashboard-grid" id="dashboard-grid" aria-label="Content placeholders"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="navigation-drawer" id="navigation-drawer" aria-label="Navigation menu" aria-hidden="true">
    <div class="drawer-top">
      <span class="drawer-brand">Stemma</span>
      <button class="icon-button drawer-close" id="drawer-close" type="button" aria-label="Close navigation">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="drawer-photo-skeleton skeleton-shimmer" aria-hidden="true"></div>
    <div class="drawer-divider" role="separator" aria-orientation="horizontal"></div>
    <nav class="drawer-links" id="drawer-links" aria-label="Sections"></nav>
    <div class="drawer-foot" aria-hidden="true"><span class="drawer-avatar-skeleton"></span><span class="drawer-foot-line skeleton-shimmer"></span></div>
  </aside>
</body>
</html>
